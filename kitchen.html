<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAVOR — Kitchen Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: 'Inter', sans-serif; }
    @keyframes slideIn { from{opacity:0;transform:translateX(-20px)} to{opacity:1;transform:translateX(0)} }
    .slide-in { animation: slideIn 0.35s ease-out; }
    @keyframes tick { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .live-dot { animation: tick 1.5s ease-in-out infinite; }
    .order-card { transition: all 0.3s ease; }
    .order-card:hover { transform: translateY(-2px); }
    .tag-spicy { background:#fee2e2; color:#991b1b; }
    .tag-halal { background:#dbeafe; color:#1e40af; }
    .tag-veg { background:#d1fae5; color:#065f46; }
    @keyframes fadeOut { from{opacity:1;transform:scale(1)} to{opacity:0;transform:scale(0.9)} }
    .fade-out { animation: fadeOut 0.4s ease-out forwards; }
    .elapsed { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="bg-gray-950 min-h-screen text-white">

  <!-- Header -->
  <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-5 py-4 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <div class="w-10 h-10 bg-orange-500 rounded-xl flex items-center justify-center shadow-lg">
          <span class="text-white font-black text-sm">S</span>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-black text-xl">Kitchen Display</span>
            <span class="live-dot w-2 h-2 bg-green-400 rounded-full"></span>
          </div>
          <p class="text-gray-400 text-xs">SAVOR Restaurant · Chef: Marcus T.</p>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <div class="text-right">
          <p class="text-xs text-gray-500 uppercase tracking-wide">Current Time</p>
          <p class="font-mono font-bold text-lg" id="clock">14:23</p>
        </div>
        <a href="index.html" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-xl text-sm font-semibold transition-colors">← Hub</a>
      </div>
    </div>
  </header>

  <!-- Stats Bar -->
  <div class="bg-gray-900 border-b border-gray-800">
    <div class="max-w-7xl mx-auto px-5 py-3 flex items-center gap-6">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 bg-blue-400 rounded-full"></span>
        <span class="text-gray-400 text-sm">New:</span>
        <span class="font-bold text-white text-sm" id="countNew">0</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 bg-amber-400 rounded-full"></span>
        <span class="text-gray-400 text-sm">Preparing:</span>
        <span class="font-bold text-white text-sm" id="countPrep">0</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 bg-green-400 rounded-full"></span>
        <span class="text-gray-400 text-sm">Ready:</span>
        <span class="font-bold text-white text-sm" id="countReady">0</span>
      </div>
      <div class="ml-auto flex items-center gap-2 text-xs text-gray-500">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        Live · refreshes every 4s
      </div>
    </div>
  </div>

  <!-- Board -->
  <div class="max-w-7xl mx-auto px-5 py-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

      <!-- NEW ORDERS Column -->
      <div>
        <div class="flex items-center gap-2.5 mb-4">
          <div class="w-3 h-3 bg-blue-400 rounded-full live-dot"></div>
          <h2 class="font-bold text-gray-100 text-base uppercase tracking-wider">New Orders</h2>
          <span id="badge-new" class="bg-blue-500/20 text-blue-400 text-xs font-bold px-2.5 py-0.5 rounded-full">0</span>
        </div>
        <div id="col-new" class="space-y-3"></div>
      </div>

      <!-- PREPARING Column -->
      <div>
        <div class="flex items-center gap-2.5 mb-4">
          <div class="w-3 h-3 bg-amber-400 rounded-full"></div>
          <h2 class="font-bold text-gray-100 text-base uppercase tracking-wider">Preparing</h2>
          <span id="badge-prep" class="bg-amber-500/20 text-amber-400 text-xs font-bold px-2.5 py-0.5 rounded-full">0</span>
        </div>
        <div id="col-prep" class="space-y-3"></div>
      </div>

      <!-- READY Column -->
      <div>
        <div class="flex items-center gap-2.5 mb-4">
          <div class="w-3 h-3 bg-green-400 rounded-full"></div>
          <h2 class="font-bold text-gray-100 text-base uppercase tracking-wider">Ready</h2>
          <span id="badge-ready" class="bg-green-500/20 text-green-400 text-xs font-bold px-2.5 py-0.5 rounded-full">0</span>
        </div>
        <div id="col-ready" class="space-y-3"></div>
      </div>
    </div>
  </div>

  <script>
  let orders = [
    {
      id:'ORD-1043', table:'B3', status:'new', elapsed:8,
      items:[
        { name:'Buffalo Chicken Wings', qty:2, tags:['Halal','Spicy'], note:'Extra crispy please' },
        { name:'Grilled Chicken Burger', qty:1, tags:['Halal'], note:'' },
      ]
    },
    {
      id:'ORD-1044', table:'A12', status:'new', elapsed:5,
      items:[
        { name:'Margherita Pizza', qty:1, tags:['Vegetarian'], note:'Extra basil' },
        { name:'Wild Mushroom Risotto', qty:1, tags:['Vegetarian'], note:'' },
      ]
    },
    {
      id:'ORD-1045', table:'D2', status:'new', elapsed:2,
      items:[
        { name:'Lamb Kofta Platter', qty:1, tags:['Halal','Spicy'], note:'No hummus' },
        { name:'Mango Lassi', qty:2, tags:[], note:'' },
      ]
    },
    {
      id:'ORD-1041', table:'C7', status:'preparing', elapsed:14,
      items:[
        { name:'Spaghetti Carbonara', qty:2, tags:[], note:'Extra parmesan' },
        { name:'Classic Caesar Salad', qty:1, tags:['Vegetarian'], note:'' },
      ]
    },
    {
      id:'ORD-1039', table:'F4', status:'preparing', elapsed:11,
      items:[
        { name:'Grilled Atlantic Salmon', qty:2, tags:['Gluten-Free'], note:'Well done' },
        { name:'Sparkling Water', qty:2, tags:[], note:'' },
      ]
    },
    {
      id:'ORD-1038', table:'E5', status:'ready', elapsed:18,
      items:[
        { name:'Crispy Calamari', qty:1, tags:['Halal'], note:'' },
        { name:'Chocolate Lava Cake', qty:2, tags:['Vegetarian'], note:'' },
      ]
    },
  ];

  function tagHtml(tags) {
    return tags.map(t => {
      let cls = 'bg-gray-700 text-gray-300';
      if (t==='Halal') cls='bg-blue-900/60 text-blue-300';
      else if (t==='Spicy') cls='bg-red-900/60 text-red-300';
      else if (t==='Vegetarian'||t==='Vegan') cls='bg-green-900/60 text-green-300';
      else if (t==='Gluten-Free') cls='bg-purple-900/60 text-purple-300';
      return `<span class="text-xs font-semibold px-2 py-0.5 rounded-full ${cls}">${t}</span>`;
    }).join('');
  }

  function elapsedColor(mins) {
    if (mins > 15) return 'text-red-400';
    if (mins > 8) return 'text-amber-400';
    return 'text-green-400';
  }

  function cardHtml(order) {
    const itemsHtml = order.items.map(item => `
      <div class="flex items-start gap-2 py-2 border-b border-gray-700/50 last:border-0">
        <span class="text-gray-300 font-bold text-sm w-5 flex-shrink-0">×${item.qty}</span>
        <div class="flex-1 min-w-0">
          <p class="text-gray-100 font-semibold text-sm">${item.name}</p>
          ${item.tags.length ? `<div class="flex gap-1 mt-1 flex-wrap">${tagHtml(item.tags)}</div>` : ''}
          ${item.note ? `<p class="text-amber-400 text-xs mt-1 font-medium">📝 ${item.note}</p>` : ''}
        </div>
      </div>
    `).join('');

    let actionBtn = '', borderColor = '';
    if (order.status === 'new') {
      actionBtn = `<button onclick="startPreparing('${order.id}')" class="w-full mt-3 bg-blue-500 hover:bg-blue-600 active:scale-95 text-white py-2.5 rounded-xl text-sm font-bold transition-all">Start Preparing 🔥</button>`;
      borderColor = 'border-l-4 border-l-blue-500';
    } else if (order.status === 'preparing') {
      actionBtn = `<button onclick="markReady('${order.id}')" class="w-full mt-3 bg-green-500 hover:bg-green-600 active:scale-95 text-white py-2.5 rounded-xl text-sm font-bold transition-all">Mark as Ready ✓</button>`;
      borderColor = 'border-l-4 border-l-amber-500';
    } else {
      actionBtn = `<div class="w-full mt-3 bg-green-500/20 text-green-400 py-2.5 rounded-xl text-sm font-bold text-center">✓ Ready for Pickup</div>`;
      borderColor = 'border-l-4 border-l-green-500';
    }

    return `
      <div id="card-${order.id}" class="order-card bg-gray-800 rounded-2xl p-4 ${borderColor} slide-in">
        <div class="flex items-center justify-between mb-3">
          <div>
            <div class="flex items-center gap-2">
              <span class="text-white font-black text-base">Table ${order.table}</span>
              <span class="text-gray-500 text-xs">${order.id}</span>
            </div>
            <p class="text-xs text-gray-500 mt-0.5">${order.items.reduce((s,i)=>s+i.qty,0)} items</p>
          </div>
          <div class="text-right">
            <p class="text-xs text-gray-500 uppercase tracking-wide">Waiting</p>
            <p class="elapsed font-bold text-sm ${elapsedColor(order.elapsed)}">${order.elapsed} min</p>
          </div>
        </div>
        <div class="divide-y divide-gray-700/30">${itemsHtml}</div>
        ${actionBtn}
      </div>
    `;
  }

  function renderBoard() {
    const newOrders = orders.filter(o=>o.status==='new');
    const prepOrders = orders.filter(o=>o.status==='preparing');
    const readyOrders = orders.filter(o=>o.status==='ready');

    document.getElementById('col-new').innerHTML = newOrders.length ? newOrders.map(cardHtml).join('') : '<p class="text-gray-600 text-sm text-center py-8">No new orders</p>';
    document.getElementById('col-prep').innerHTML = prepOrders.length ? prepOrders.map(cardHtml).join('') : '<p class="text-gray-600 text-sm text-center py-8">Nothing being prepared</p>';
    document.getElementById('col-ready').innerHTML = readyOrders.length ? readyOrders.map(cardHtml).join('') : '<p class="text-gray-600 text-sm text-center py-8">No orders ready</p>';

    document.getElementById('countNew').textContent = newOrders.length;
    document.getElementById('countPrep').textContent = prepOrders.length;
    document.getElementById('countReady').textContent = readyOrders.length;
    document.getElementById('badge-new').textContent = newOrders.length;
    document.getElementById('badge-prep').textContent = prepOrders.length;
    document.getElementById('badge-ready').textContent = readyOrders.length;
  }

  function startPreparing(id) {
    const o = orders.find(x=>x.id===id);
    if (!o) return;
    const card = document.getElementById('card-'+id);
    if (card) card.classList.add('fade-out');
    setTimeout(() => { o.status = 'preparing'; renderBoard(); }, 350);
  }

  function markReady(id) {
    const o = orders.find(x=>x.id===id);
    if (!o) return;
    const card = document.getElementById('card-'+id);
    if (card) card.classList.add('fade-out');
    setTimeout(() => { o.status = 'ready'; renderBoard(); }, 350);
  }

  // Clock
  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    document.getElementById('clock').textContent = h+':'+m;
  }
  updateClock();
  setInterval(updateClock, 1000);

  // Tick elapsed times
  setInterval(() => {
    orders.forEach(o => { if (o.status!=='ready') o.elapsed++; });
    // Re-render elapsed times without full rerender
    orders.forEach(o => {
      const card = document.getElementById('card-'+o.id);
      if (card) {
        const elapsed = card.querySelector('.elapsed');
        if (elapsed) { elapsed.textContent = o.elapsed+' min'; elapsed.className = `elapsed font-bold text-sm ${elapsedColor(o.elapsed)}`; }
      }
    });
  }, 60000);

  renderBoard();
  </script>
</body>
</html>
